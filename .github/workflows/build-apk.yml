name: Build Indian GTA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (full log saved to logs/)
        shell: bash
        run: |
          mkdir -p logs out
          bash scripts/build.sh 2>&1 | tee logs/build-full.log

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## BUILD FAILED"
            echo "Full logs: Artifacts -> build-logs"
            echo '### Error lines'
            echo '```'
            grep -n -E "error:|FAILURE|What went wrong|Exception|ERR!|FAILED at" logs/build-full.log | head -40 || true
            echo '```'
            echo '### Last 60 lines'
            echo '```'
            tail -n 60 logs/build-full.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndianGTA-apk
          path: out/IndianGTA.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Indian GTA build ${{ github.run_number }}
          files: out/IndianGTA.apk
